# herdr configuration
# Ported from ~/dotfiles/tmux/tmux.conf

[theme]
name = "kanagawa"

auto_switch = false
[keys]
# Matches tmux: remapped from C-b to C-a
prefix = "ctrl+a"

# Side-by-side split. tmux used `prefix |` (split-window -h).
# herdr calls this "vertical"; its default was prefix+v.
split_vertical = "prefix+|"

# Left at herdr defaults, already matching tmux:
#   focus_pane_left/down/up/right = prefix+h/j/k/l
#   split_horizontal              = prefix+minus
#   new_tab                       = prefix+c
#   switch_tab                    = prefix+1..9
#   zoom                          = prefix+z
#
# Intentional divergences from tmux:
#   prefix+r       = resize_mode (modal), replaces tmux's repeatable prefix+H/J/K/L
#   prefix+shift+r = reload_config (tmux used prefix+r)
#   prefix+w       = workspace_picker, replaces the sesh fzf popup on prefix+s
#   prefix+q       = detach (tmux used prefix+d)

[ui]
agent_panel_sort = "spaces"

# Skip onboarding
onboarding = false
