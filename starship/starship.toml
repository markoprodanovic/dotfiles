add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status$cmd_duration]($style)\n$character"

[cmd_duration]
min_time = 500
format = "[$duration]($style) "
style = "italic #7a9ab8"

[character]
error_symbol = "[✗](bold #7a9ab8)"
success_symbol = "[❯](bold #7a9ab8)"

[directory]
style = "#7a9ab8"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #7a9ab8"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #7a9ab8"

[git_status]
format     = '[$all_status]($style)'
style      = "#7a9ab8"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
